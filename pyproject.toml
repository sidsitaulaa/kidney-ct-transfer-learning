[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kidney-tl"
version = "1.0.0"
description = "Leakage-aware transfer-learning benchmark for kidney CT classification (cyst, normal, stone, tumour)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Siddhartha Sitaula" }, { name = "Rabin Maharjan" }]
dependencies = [
    "tensorflow>=2.15,<2.16",
    "numpy>=1.23,<2",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pillow>=9",
]

[project.optional-dependencies]
data = ["kagglehub>=0.3", "huggingface_hub>=0.20", "pyarrow>=14"]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/kidney_tl/report.py" = ["E501"]  # long lines are the markdown report template
"scripts/run_improvements.py" = ["E501"]  # same: markdown template
"scripts/compare_models.py" = ["E501"]  # same: markdown template
